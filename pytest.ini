[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    integration: tests that require real yt-dlp binary or network

addopts = -v

[coverage:run]
source = core
omit =
    tests/*
    venv/*

[coverage:report]
fail_under = 70
show_missing = true
